    <!-- Dark background before any CSS loads: avoids the white launch flash on iOS -->
    <style>
      html {
        background: #0b0c0f;
      }
      html[data-theme='light'] {
        background: #f4f5f7;
      }
    </style>
    <!-- Resolve the theme before first paint (mirror of the theme store, key fp.theme) -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('fp.theme')
          var theme =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'dark'
          var resolved =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : theme
          document.documentElement.dataset.theme = resolved
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', resolved === 'light' ? '#F4F5F7' : '#0B0C0F')
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
